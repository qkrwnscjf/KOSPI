# Slack 알림 수신처 (docs/Task_ORDER.md T-163, 2026-11-07 사용자 승인: SEC-011 결정 변경, docs/security.md SEC-018)
# - 웹훅 주소는 비밀값이라 이 파일에 적지 않는다. 사용자가 프로젝트 루트 .env의 SLACK_WEBHOOK_URL에 넣고,
#   docker-compose가 grafana 컨테이너에만 넘긴다. 이 파일은 그 환경변수를 가리키기만 한다.
# - .env에 값이 없으면 docker-compose의 기본값(컨테이너 안의 닫힌 포트 127.0.0.1:9)으로 보내져 실패할 뿐 외부로 나가지 않는다.
# - 메시지에는 규칙 이름, 심각도, 요약 문구만 넣는다(공개 시세 수치와 내부 서비스 이름 수준). 접속 정보·비밀값은 넣지 않는다.
# - 템플릿 안에서는 "$"를 쓰지 않는다(Grafana가 이 파일의 $이름을 환경변수로 바꾸기 때문).
apiVersion: 1

templates:
  - orgId: 1
    name: kospi-slack
    # 발생과 해결을 나눠 보여 준다(2026-11-08). 요약 문구는 규칙에 고정된 "문제" 설명이라 해결된 알림에는 쓰지 않는다
    template: |
      {{ define "kospi.slack.title" }}KOSPI 파이프라인 알림 — 발생 {{ len .Alerts.Firing }}건 · 해결 {{ len .Alerts.Resolved }}건{{ end }}
      {{ define "kospi.slack.text" }}{{ if .Alerts.Firing }}*발생*
      {{ range .Alerts.Firing }}• {{ .Labels.alertname }} ({{ .Labels.severity }}): {{ .Annotations.summary }}
      {{ end }}{{ end }}{{ if .Alerts.Resolved }}*해결*
      {{ range .Alerts.Resolved }}• {{ .Labels.alertname }}{{ if .Labels.job }} ({{ .Labels.job }}){{ end }}: 정상으로 돌아왔습니다.
      {{ end }}{{ end }}{{ end }}

contactPoints:
  - orgId: 1
    name: kospi-slack
    receivers:
      - uid: kospi-slack
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: '{{ template "kospi.slack.title" . }}'
          text: '{{ template "kospi.slack.text" . }}'
        disableResolveMessage: false

# 모든 알림 규칙(kospi-alerts.yml)을 이 수신처로 보낸다. 같은 규칙은 묶고, 해결되지 않은 알림은 4시간마다 한 번만 다시 보낸다
policies:
  - orgId: 1
    receiver: kospi-slack
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
