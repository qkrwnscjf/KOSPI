<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>KOSPI Insight</title>
    <!--
      테마를 화면을 그리기 전에 적용해서, 다크 모드 사용자에게 흰 화면이 잠깐 보이지 않게 한다 (T-54).
      저장된 선택이 있으면 그것, 없으면 운영체제의 다크 모드 설정을 따른다 (plan.md FQA-12, T-203, src/lib/themeChoice.ts와 같은 규칙).
      저장소를 쓸 수 없으면 운영체제 설정만 본다.
    -->
    <script>
      var stored = null
      try { stored = localStorage.getItem('kospi-theme') } catch (e) {}
      var prefersDark = false
      try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
      if (stored === 'dark' || (stored !== 'light' && prefersDark)) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
