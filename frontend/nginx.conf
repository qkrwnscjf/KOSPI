# 화면 정적 파일 서버 설정 (plan.md FQA-18, T-207)
# 예전에는 nginx 기본 설정이라 압축이 꺼져 있고 캐시 헤더가 없었다(첫 로딩 때 JS 약 868 kB를 그대로 보냄).
# - 압축: JS·CSS·JSON·SVG를 gzip으로 보낸다(빌드 기준 JS 868 → 약 257 kB)
# - 캐시: 빌드가 파일 이름에 내용 해시를 붙이는 /assets/는 1년 동안 그대로 쓰고, index.html은 매번 새로 확인한다(새 빌드를 바로 받게)
# - 서버 버전을 응답 헤더에 싣지 않는다
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
