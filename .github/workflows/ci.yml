name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# CI 토큰은 코드 읽기만 (docs/security.md SEC-007, plan.md 5장 S-3, T-37). 저장소 기본 설정이 바뀌어도 쓰기 권한을 받지 않는다
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    # 잠금 파일 그대로 설치 (plan.md QA-43 / P6-3, T-182)
    - name: Build Backend
      working-directory: ./backend
      run: |
        npm ci
        npm run build

    # 테스트 (docs/Task_ORDER.md T-45): Node 내장 node:test, 새 의존성 없음
    - name: Test Backend
      working-directory: ./backend
      run: npm test

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    - name: Test Frontend
      working-directory: ./frontend
      run: npm test

    # 시험 코드 타입 검사와 lint (plan.md P6-3 · QA-43, T-224)
    - name: Typecheck Frontend Tests
      working-directory: ./frontend
      run: npm run typecheck:test

    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint

    - name: Docker Compose Build Test
      run: docker compose build
